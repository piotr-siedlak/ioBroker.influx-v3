version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: cron
          cronjob: '17 4 9 * *'
      # wait a week before proposing a new release (supply-chain safety)
      cooldown:
          default-days: 7
      open-pull-requests-limit: 15
      versioning-strategy: increase
      ignore:
          # @types/node follows the minimum supported Node.js version (engines: >=22)
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: cron
          cronjob: '41 4 9 * *'
      cooldown:
          default-days: 7

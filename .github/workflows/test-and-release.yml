name: Test and Release

on:
    push:
        branches:
            - 'main'
        tags:
            # normal versions
            - 'v[0-9]+.[0-9]+.[0-9]+'
            # pre-releases
            - 'v[0-9]+.[0-9]+.[0-9]+-**'
    pull_request: {}

concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # Quick checks before the expensive test runs: type check, lint, package files
    check-and-lint:
        if: contains(github.event.head_commit.message, '[skip ci]') == false
        runs-on: ubuntu-latest
        steps:
            - uses: ioBroker/testing-action-check@v2
              with:
                  node-version: '22.x'
                  type-checking: true
                  lint: true

    # Unit tests + adapter integration tests (real js-controller) on all supported Node.js versions and OSes
    adapter-tests:
        if: contains(github.event.head_commit.message, '[skip ci]') == false
        needs: [check-and-lint]
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                node-version: [22.x, 24.x, 26.x]
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - uses: ioBroker/testing-action-adapter@v1
              with:
                  node-version: ${{ matrix.node-version }}
                  os: ${{ matrix.os }}
                  build: true

    # Tests against a real InfluxDB 3 Core server (Docker service, Linux only)
    influxdb3-tests:
        if: contains(github.event.head_commit.message, '[skip ci]') == false
        needs: [check-and-lint]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24.x
            - run: npm ci
            - name: Start InfluxDB 3 Core
              run: |
                  docker run -d --name influx3 -p 8181:8181 influxdb:3-core \
                    influxdb3 serve --node-id ci --object-store memory
                  for i in $(seq 1 30); do
                    docker exec influx3 influxdb3 create token --admin > token.txt 2>&1 && break
                    sleep 2
                  done
                  echo "INFLUX3_TOKEN=$(grep -oE 'apiv3_[A-Za-z0-9_-]+' token.txt | head -1)" >> "$GITHUB_ENV"
                  rm -f token.txt
            - name: Run InfluxDB 3 tests
              env:
                  INFLUX3_URL: http://localhost:8181
              run: npm run test:influx

    # Deploys the final package to NPM (trusted publishing) — only for version tags
    deploy:
        needs: [check-and-lint, adapter-tests, influxdb3-tests]
        if: |
            contains(github.event.head_commit.message, '[skip ci]') == false &&
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: write
        steps:
            - uses: ioBroker/testing-action-deploy@v1
              with:
                  node-version: '24.x'
                  build: true
                  github-token: ${{ secrets.GITHUB_TOKEN }}
